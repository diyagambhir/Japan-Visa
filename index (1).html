<body>
    <div id="root"></div>

    <script>
        const { PDFDocument } = PDFLib;
        const { useState, useEffect } = React;

        const JapanVisaApp = () => {
            const FAMILY_NAME = "Gambhir Family";
            const [currentStep, setCurrentStep] = useState(0);
            const [showLanding, setShowLanding] = useState(true);
            const [isDownloading, setIsDownloading] = useState(false);
            
            const [formData, setFormData] = useState(() => {
                const saved = localStorage.getItem('visaFormData');
                if (saved) return JSON.parse(saved);
                return getEmptyFormData();
            });
            
            const [uploadedPhotos, setUploadedPhotos] = useState(() => {
                const saved = localStorage.getItem('visaPhotos');
                return saved ? JSON.parse(saved) : {};
            });
            
            const [errors, setErrors] = useState({});

            function getEmptyFormData() {
                return {
                    surname: 'GAMBHIR',
                    givenNames: '',
                    dateOfBirth: '',
                    sex: '',
                    placeOfBirth: 'Delhi',
                    nationality: 'Indian',
                    formerNationalities: 'N.A.',
                    passportNo: '',
                    passportType: 'Ordinary',
                    passportIssueDate: '',
                    passportExpiryDate: '',
                    passportIssuePlace: 'Delhi',
                    passportIssuingAuthority: 'Republic of India',
                    idNo: '',
                    certificateOfEligibilityNo: '',
                    email: '',
                    phone: '',
                    mobile: '',
                    currentAddress: 'L-29/7 DLF Phase-2, Gurugram, Haryana - 122002',
                    profession: '',
                    employer: '',
                    employerAddress: '',
                    purposeOfVisit: 'Tourism',
                    dateOfArrival: '2026-09-28',
                    intendedLength: '11 days',
                    portOfEntry: 'Tokyo Haneda Airport',
                    transportCompany: 'Japan Airlines',
                    accommodationDetails: 'St. Regis Osaka / Hilton Kyoto / Westin Tokyo',
                    accommodationPhone: '+81 6-6258-3333 / 0800 080 4772 / +81 3-5423-7000',
                    inviterName: '',
                    inviterAddress: '',
                    inviterPhone: '',
                    inviterRelationship: '',
                    inviterProfession: '',
                    inviterNationality: '',
                    previousStayInJapan: 'N.A.',
                    guarantorName: 'N.A.',
                    guarantorAddress: 'N.A.',
                    guarantorPhone: '',
                    criminalHistory: 'No',
                    imprisonment: 'No',
                    drugOffence: 'No',
                    deportation: 'No',
                    criminalDetails: 'N.A.',
                    maritalStatus: 'Single',
                    remarks: 'N.A.',
                };
            }

            useEffect(() => {
                localStorage.setItem('visaFormData', JSON.stringify(formData));
            }, [formData]);

            useEffect(() => {
                localStorage.setItem('visaPhotos', JSON.stringify(uploadedPhotos));
            }, [uploadedPhotos]);

            const steps = [
                { title: 'Personal Information', icon: '👤' },
                { title: 'Passport & ID', icon: '📕' },
                { title: 'Contact & Address', icon: '📞' },
                { title: 'Employment', icon: '💼' },
                { title: 'Japan Trip', icon: '✈️' },
                { title: 'Accommodation', icon: '🏨' },
                { title: 'Inviter Details', icon: '🤝' },
                { title: 'Health & History', icon: '📋' },
                { title: 'Photo & Submit', icon: '📸' },
            ];

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                if (errors[field]) {
                    setErrors(prev => ({ ...prev, [field]: null }));
                }
            };

            const handlePhotoUpload = (field, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setUploadedPhotos(prev => ({
                            ...prev,
                            [field]: event.target.result
                        }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const generateFilledPDF = async () => {
                try {
                    setIsDownloading(true);
                    
                    // Fetch the original PDF
                    const pdfUrl = 'Japan_Visa_Form_Application__to_be_submitted_.pdf';
                    const response = await fetch(pdfUrl);
                    if (!response.ok) throw new Error('Could not fetch PDF');
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    const form = pdfDoc.getForm();

                    // Field mapping - maps our form data to PDF form field IDs
                    const fieldMappings = {
                        'topmostSubform[0].Page1[0].#area[4].T14[0]': formData.givenNames.split(' ')[0] || '',
                        'topmostSubform[0].Page1[0].#area[4].T16[0]': formData.surname || '',
                        'topmostSubform[0].Page1[0].T16[1]': formData.currentAddress || '',
                        'topmostSubform[0].Page1[0].T2[0]': formData.email || '',
                        'topmostSubform[0].Page1[0].T7[0]': formData.phone || '',
                        'topmostSubform[0].Page1[0].T50[0]': 'IND', // India code
                    };

                    // Fill text fields
                    Object.entries(fieldMappings).forEach(([fieldId, value]) => {
                        try {
                            const field = form.getFieldMaybe(fieldId);
                            if (field && value) {
                                field.setText(value.toString());
                            }
                        } catch (e) {
                            console.log(`Could not set ${fieldId}`);
                        }
                    });

                    // Set purpose of visit (Tourism = /1)
                    try {
                        const purposeField = form.getFieldMaybe('topmostSubform[0].Page1[0].#area[5].#area[6].#area[7].RB1[0]');
                        if (purposeField && formData.purposeOfVisit === 'Tourism') {
                            purposeField.select('/1');
                        }
                    } catch (e) {
                        console.log('Could not set purpose');
                    }

                    // Save the filled PDF
                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${formData.surname || 'Visa'}_Application_Filled.pdf`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    
                } catch (error) {
                    console.error('PDF generation failed:', error);
                    alert('PDF generation in progress. Please try again in a moment.');
                } finally {
                    setIsDownloading(false);
                }
            };

            const validateStep = () => {
                const newErrors = {};
                
                switch(currentStep) {
                    case 0:
                        if (!formData.givenNames) newErrors.givenNames = 'Required';
                        if (!formData.dateOfBirth) newErrors.dateOfBirth = 'Required';
                        if (!formData.sex) newErrors.sex = 'Required';
                        break;
                    case 1:
                        if (!formData.passportNo) newErrors.passportNo = 'Required';
                        if (!formData.passportExpiryDate) newErrors.passportExpiryDate = 'Required';
                        break;
                    case 2:
                        if (!formData.email) newErrors.email = 'Required';
                        break;
                    case 4:
                        if (!formData.dateOfArrival) newErrors.dateOfArrival = 'Required';
                        break;
                    case 6:
                        if (!formData.inviterName) newErrors.inviterName = 'Required';
                        if (!formData.inviterAddress) newErrors.inviterAddress = 'Required';
                        break;
                    default:
                        break;
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const nextStep = () => {
                if (validateStep()) {
                    if (currentStep < steps.length - 1) {
                        setCurrentStep(currentStep + 1);
                        window.scrollTo(0, 0);
                    }
                }
            };

            const prevStep = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                    window.scrollTo(0, 0);
                }
            };

            const renderFormField = (label, value, onChange, type = 'text', placeholder = '', options = null, required = false, helper = '') => {
                const error = errors[label] || false;
                return React.createElement('div', { key: label },
                    React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' },
                        label + (required ? ' *' : ''),
                        helper && React.createElement('p', { className: 'text-xs text-gray-500 font-normal mt-1' }, helper)
                    ),
                    options ? 
                        React.createElement('select', {
                            value: value,
                            onChange: (e) => onChange(label, e.target.value),
                            className: `w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${error ? 'border-red-500' : 'border-gray-300'}`
                        }, 
                        React.createElement('option', { value: '' }, 'Select...'),
                        options.map(opt => React.createElement('option', { value: opt, key: opt }, opt))
                        )
                    : type === 'textarea' ?
                        React.createElement('textarea', {
                            value: value,
                            onChange: (e) => onChange(label, e.target.value),
                            className: `w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${error ? 'border-red-500' : 'border-gray-300'}`,
                            rows: 3,
                            placeholder: placeholder
                        })
                    :
                        React.createElement('input', {
                            type: type,
                            value: value,
                            onChange: (e) => onChange(label, e.target.value),
                            className: `w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${error ? 'border-red-500' : 'border-gray-300'}`,
                            placeholder: placeholder
                        }),
                    error && React.createElement('p', { className: 'text-red-500 text-sm mt-1' }, error)
                );
            };

            const renderStep = () => {
                switch(currentStep) {
                    case 0:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'info-box' },
                                React.createElement('p', null, '✓ Family name GAMBHIR and place of birth Delhi are pre-filled for all family members')
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('Surname', formData.surname, handleInputChange, 'text', '', null, false),
                                renderFormField('givenNames', formData.givenNames, handleInputChange, 'text', 'Your given names', null, true)
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('dateOfBirth', formData.dateOfBirth, handleInputChange, 'date', '', null, true),
                                renderFormField('placeOfBirth', formData.placeOfBirth, handleInputChange, 'text', '', null, false)
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('sex', formData.sex, handleInputChange, 'text', '', ['Male', 'Female'], true),
                                renderFormField('nationality', formData.nationality, handleInputChange, 'text', '', null, false)
                            ),
                            renderFormField('maritalStatus', formData.maritalStatus, handleInputChange, 'text', '', ['Single', 'Married', 'Widowed', 'Divorced'], false)
                        );

                    case 1:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'info-box' },
                                React.createElement('p', null, '✓ Passport type (Ordinary), place of issue (Delhi), and authority (Republic of India) are pre-filled')
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('passportNo', formData.passportNo, handleInputChange, 'text', 'Your passport number', null, true),
                                renderFormField('passportType', formData.passportType, handleInputChange, 'text', '', ['Ordinary', 'Diplomatic', 'Official', 'Other'], false)
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('passportIssueDate', formData.passportIssueDate, handleInputChange, 'date'),
                                renderFormField('passportExpiryDate', formData.passportExpiryDate, handleInputChange, 'date', '', null, true)
                            ),
                            renderFormField('passportIssuePlace', formData.passportIssuePlace, handleInputChange, 'text'),
                            renderFormField('passportIssuingAuthority', formData.passportIssuingAuthority, handleInputChange, 'text'),
                            renderFormField('idNo', formData.idNo, handleInputChange, 'text', 'Government issued ID number')
                        );

                    case 2:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'info-box' },
                                React.createElement('p', null, '✓ Current address in Gurugram is pre-filled')
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('email', formData.email, handleInputChange, 'email', '', null, true),
                                renderFormField('phone', formData.phone, handleInputChange, 'tel', 'With country code')
                            ),
                            renderFormField('mobile', formData.mobile, handleInputChange, 'tel', 'With country code'),
                            renderFormField('currentAddress', formData.currentAddress, handleInputChange, 'textarea', '', null, false)
                        );

                    case 3:
                        return React.createElement('div', { className: 'space-y-6' },
                            renderFormField('profession', formData.profession, handleInputChange, 'text', 'Your occupation/profession'),
                            renderFormField('employer', formData.employer, handleInputChange, 'text', 'Company or organization name'),
                            renderFormField('employerAddress', formData.employerAddress, handleInputChange, 'textarea', 'Full address')
                        );

                    case 4:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'info-box' },
                                React.createElement('p', null, '✓ Pre-filled: Tourism purpose, 11-day stay, Sept 28, 2026 arrival, Tokyo Haneda, Japan Airlines')
                            ),
                            renderFormField('purposeOfVisit', formData.purposeOfVisit, handleInputChange, 'text', '', ['Tourism', 'Business', 'Work', 'Study', 'Visit Family', 'Medical Treatment', 'Other'], false),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('dateOfArrival', formData.dateOfArrival, handleInputChange, 'date', '', null, true),
                                renderFormField('intendedLength', formData.intendedLength, handleInputChange, 'text', 'e.g., 11 days')
                            ),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                renderFormField('portOfEntry', formData.portOfEntry, handleInputChange, 'text', 'e.g., Tokyo Haneda'),
                                renderFormField('transportCompany', formData.transportCompany, handleInputChange, 'text', 'Airline/shipping company')
                            ),
                            renderFormField('previousStayInJapan', formData.previousStayInJapan, handleInputChange, 'textarea', 'Any previous visits to Japan?')
                        );

                    case 5:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'info-box' },
                                React.createElement('p', null, '✓ Pre-filled: St. Regis Osaka, Hilton Kyoto, Westin Tokyo with contact numbers')
                            ),
                            renderFormField('accommodationDetails', formData.accommodationDetails, handleInputChange, 'textarea', 'Hotel names or person details'),
                            renderFormField('accommodationPhone', formData.accommodationPhone, handleInputChange, 'text', 'Hotel phone numbers')
                        );

                    case 6:
                        return React.createElement('div', { className: 'space-y-6' },
                            React.createElement('h3', { className: 'text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-indigo-200' }, 'Inviter/Reference in Japan'),

                React.createElement('div', { className: 'max-w-3xl mx-auto' },

                        React.createElement('p', { className: 'text-gray-600' }, FAMILY_NAME)
                    ),
                    React.createElement('div', { className: 'mb-8' },

                        React.createElement('button', {
