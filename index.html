<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Visa Application | Gambhir Family</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #f9fafb;
            color: #111827;
            line-height: 1.6;
        }

        .min-h-screen { min-height: 100vh; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .max-w-3xl { max-width: 48rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .ml-2 { margin-left: 0.5rem; }
        .text-center { text-align: center; }
        .text-3xl { font-size: 1.875rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-xl { font-size: 1.25rem; }
        .text-lg { font-size: 1.125rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .text-gray-900 { color: #111827; }
        .text-gray-700 { color: #374151; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-500 { color: #6b7280; }
        .text-white { color: #ffffff; }
        .text-red-500 { color: #ef4444; }
        .text-green-800 { color: #166534; }
        .text-blue-800 { color: #1e40af; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .bg-gray-200 { background-color: #e5e7eb; }
        .bg-gray-400 { background-color: #9ca3af; }
        .bg-white { background-color: #ffffff; }
        .bg-indigo-50 { background-color: #eef2ff; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .bg-indigo-700 { background-color: #4338ca; }
        .bg-pink-50 { background-color: #fdf2f8; }
        .bg-pink-500 { background-color: #ec4899; }
        .bg-amber-50 { background-color: #fffbeb; }
        .bg-blue-50 { background-color: #eff6ff; }
        .bg-blue-200 { background-color: #bfdbfe; }
        .bg-green-50 { background-color: #f0fdf4; }
        .bg-green-600 { background-color: #16a34a; }
        .bg-green-700 { background-color: #15803d; }
        .hover\:bg-indigo-700:hover { background-color: #4338ca; }
        .hover\:bg-gray-300:hover { background-color: #d1d5db; }
        .hover\:bg-green-700:hover { background-color: #15803d; }
        .border { border: 1px solid #d1d5db; }
        .border-2 { border: 2px dashed #a5b4fc; }
        .border-red-500 { border-color: #ef4444; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .p-8 { padding: 2rem; }
        .p-6 { padding: 1.5rem; }
        .p-4 { padding: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .h-2 { height: 0.5rem; }
        .h-10 { height: 2.5rem; }
        .w-full { width: 100%; }
        .w-4 { width: 1rem; }
        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: 1fr; }
        .transition { transition: all 0.2s; }

        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            line-height: 1.5;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            cursor: pointer;
            font-weight: 600;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .info-box {
            background-color: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .space-y-6 > * + * { margin-top: 1.5rem; }

        @media (min-width: 768px) {
            .md\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
            .md\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
            .md\:text-5xl { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class VisaApp {
            constructor() {
                this.currentStep = 0;
                this.showLanding = true;
                this.isDownloading = false;
                this.formData = this.loadFormData();
                this.errors = {};
                
                this.steps = [
                    { title: 'Personal Information', icon: '👤' },
                    { title: 'Passport & ID', icon: '📕' },
                    { title: 'Contact & Address', icon: '📞' },
                    { title: 'Employment', icon: '💼' },
                    { title: 'Japan Trip', icon: '✈️' },
                    { title: 'Accommodation', icon: '🏨' },
                    { title: 'Inviter Details', icon: '🤝' },
                    { title: 'Health & History', icon: '📋' },
                    { title: 'Photo & Submit', icon: '📸' },
                ];
                
                this.render();
            }

            getEmptyFormData() {
                return {
                    surname: 'GAMBHIR',
                    givenNames: '',
                    dateOfBirth: '',
                    sex: '',
                    placeOfBirth: 'Delhi',
                    nationality: 'Indian',
                    passportNo: '',
                    passportExpiryDate: '',
                    email: '',
                    phone: '',
                    mobile: '',
                    currentAddress: 'L-29/7 DLF Phase-2, Gurugram, Haryana - 122002',
                    profession: '',
                    employer: '',
                    purposeOfVisit: 'Tourism',
                    dateOfArrival: '2026-09-28',
                    intendedLength: '11 days',
                    portOfEntry: 'Tokyo Haneda Airport',
                    transportCompany: 'Japan Airlines',
                    accommodationDetails: 'St. Regis Osaka / Hilton Kyoto / Westin Tokyo',
                    inviterName: '',
                    inviterAddress: '',
                    inviterPhone: '',
                    criminalHistory: 'No',
                    maritalStatus: 'Single',
                };
            }

            loadFormData() {
                try {
                    const saved = localStorage.getItem('visaFormData');
                    return saved ? JSON.parse(saved) : this.getEmptyFormData();
                } catch (e) {
                    return this.getEmptyFormData();
                }
            }

            saveFormData() {
                try {
                    localStorage.setItem('visaFormData', JSON.stringify(this.formData));
                } catch (e) {
                    console.warn('Could not save to localStorage');
                }
            }

            handleInputChange(field, value) {
                this.formData[field] = value;
                if (this.errors[field]) delete this.errors[field];
                this.saveFormData();
                this.render();
            }

            validateStep() {
                this.errors = {};
                
                switch(this.currentStep) {
                    case 0:
                        if (!this.formData.givenNames) this.errors.givenNames = 'Required';
                        if (!this.formData.dateOfBirth) this.errors.dateOfBirth = 'Required';
                        if (!this.formData.sex) this.errors.sex = 'Required';
                        break;
                    case 1:
                        if (!this.formData.passportNo) this.errors.passportNo = 'Required';
                        if (!this.formData.passportExpiryDate) this.errors.passportExpiryDate = 'Required';
                        break;
                    case 2:
                        if (!this.formData.email) this.errors.email = 'Required';
                        break;
                    case 6:
                        if (!this.formData.inviterName) this.errors.inviterName = 'Required';
                        if (!this.formData.inviterAddress) this.errors.inviterAddress = 'Required';
                        break;
                }
                
                return Object.keys(this.errors).length === 0;
            }

            nextStep() {
                if (this.validateStep()) {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        window.scrollTo(0, 0);
                    }
                }
                this.render();
            }

            prevStep() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    window.scrollTo(0, 0);
                }
                this.render();
            }

            downloadData() {
                const data = [
                    ['Field', 'Value'],
                    ['Surname', this.formData.surname],
                    ['Given Names', this.formData.givenNames],
                    ['Date of Birth', this.formData.dateOfBirth],
                    ['Sex', this.formData.sex],
                    ['Email', this.formData.email],
                    ['Phone', this.formData.phone],
                    ['Passport Number', this.formData.passportNo],
                    ['Passport Expiry', this.formData.passportExpiryDate],
                    ['Current Address', this.formData.currentAddress],
                    ['Purpose of Visit', this.formData.purposeOfVisit],
                    ['Date of Arrival', this.formData.dateOfArrival],
                    ['Accommodation', this.formData.accommodationDetails],
                ];

                const csv = data.map(row => 
                    row.map(cell => `"${(cell || '').toString().replace(/"/g, '""')}"`)
                        .join(',')
                ).join('\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${this.formData.surname}_Application.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            }

            renderField(label, value, type = 'text', options = null, required = false) {
                const error = this.errors[label];
                let input = '';
                
                if (options) {
                    input = `<select onchange="app.handleInputChange('${label}', this.value)" class="border ${error ? 'border-red-500' : ''}">
                        <option value="">Select...</option>
                        ${options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>`;
                } else if (type === 'textarea') {
                    input = `<textarea onchange="app.handleInputChange('${label}', this.value)" class="border ${error ? 'border-red-500' : ''}" rows="3">${value || ''}</textarea>`;
                } else {
                    input = `<input type="${type}" value="${value || ''}" onchange="app.handleInputChange('${label}', this.value)" class="border ${error ? 'border-red-500' : ''}" />`;
                }

                return `<div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">${label}${required ? ' *' : ''}</label>
                    ${input}
                    ${error ? `<p class="text-red-500 text-sm mt-1">${error}</p>` : ''}
                </div>`;
            }

            renderStep() {
                let html = '';

                switch(this.currentStep) {
                    case 0:
                        html = `
                            <div class="info-box"><p>✓ Family name GAMBHIR is pre-filled</p></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>${this.renderField('Surname', this.formData.surname)}</div>
                                <div>${this.renderField('givenNames', this.formData.givenNames, 'text', null, true)}</div>
                            </div>
                            ${this.renderField('dateOfBirth', this.formData.dateOfBirth, 'date', null, true)}
                            ${this.renderField('sex', this.formData.sex, 'text', ['Male', 'Female'], true)}
                            ${this.renderField('placeOfBirth', this.formData.placeOfBirth, 'text')}
                            ${this.renderField('nationality', this.formData.nationality, 'text')}
                            ${this.renderField('maritalStatus', this.formData.maritalStatus, 'text', ['Single', 'Married', 'Widowed', 'Divorced'])}
                        `;
                        break;
                    case 1:
                        html = `
                            <div class="info-box"><p>✓ Passport details pre-filled</p></div>
                            ${this.renderField('passportNo', this.formData.passportNo, 'text', null, true)}
                            ${this.renderField('passportExpiryDate', this.formData.passportExpiryDate, 'date', null, true)}
                        `;
                        break;
                    case 2:
                        html = `
                            <div class="info-box"><p>✓ Current address in Gurugram is pre-filled</p></div>
                            ${this.renderField('email', this.formData.email, 'email', null, true)}
                            ${this.renderField('phone', this.formData.phone, 'tel')}
                            ${this.renderField('mobile', this.formData.mobile, 'tel')}
                            ${this.renderField('currentAddress', this.formData.currentAddress, 'textarea')}
                        `;
                        break;
                    case 3:
                        html = `
                            ${this.renderField('profession', this.formData.profession, 'text')}
                            ${this.renderField('employer', this.formData.employer, 'text')}
                        `;
                        break;
                    case 4:
                        html = `
                            <div class="info-box"><p>✓ Pre-filled: Tourism, Sept 28, Tokyo Haneda, Japan Airlines</p></div>
                            ${this.renderField('purposeOfVisit', this.formData.purposeOfVisit, 'text', ['Tourism', 'Business', 'Work', 'Study'])}
                            ${this.renderField('dateOfArrival', this.formData.dateOfArrival, 'date')}
                            ${this.renderField('intendedLength', this.formData.intendedLength, 'text')}
                            ${this.renderField('portOfEntry', this.formData.portOfEntry, 'text')}
                            ${this.renderField('transportCompany', this.formData.transportCompany, 'text')}
                        `;
                        break;
                    case 5:
                        html = `
                            <div class="info-box"><p>✓ Pre-filled: St. Regis Osaka, Hilton Kyoto, Westin Tokyo</p></div>
                            ${this.renderField('accommodationDetails', this.formData.accommodationDetails, 'textarea')}
                        `;
                        break;
                    case 6:
                        html = `
                            <h3 class="text-lg font-semibold text-gray-900 mb-4">Inviter in Japan</h3>
                            ${this.renderField('inviterName', this.formData.inviterName, 'text', null, true)}
                            ${this.renderField('inviterAddress', this.formData.inviterAddress, 'textarea', null, true)}
                            ${this.renderField('inviterPhone', this.formData.inviterPhone, 'tel')}
                        `;
                        break;
                    case 7:
                        html = `
                            <div class="info-box"><p>All answers pre-filled as "No"</p></div>
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-3">Any criminal history?</label>
                                <div class="flex gap-4">
                                    <label><input type="radio" value="No" ${this.formData.criminalHistory === 'No' ? 'checked' : ''} onchange="app.handleInputChange('criminalHistory', this.value)" /> No</label>
                                    <label><input type="radio" value="Yes" ${this.formData.criminalHistory === 'Yes' ? 'checked' : ''} onchange="app.handleInputChange('criminalHistory', this.value)" /> Yes</label>
                                </div>
                            </div>
                        `;
                        break;
                    case 8:
                        html = `
                            <div class="bg-green-50 border border-blue-200 rounded-lg p-4 mb-6">
                                <h3 class="font-semibold text-green-800 mb-2">Ready! ✓</h3>
                                <p class="text-sm text-green-800 mb-4">Download your visa application data.</p>
                                <button onclick="app.downloadData()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg">
                                    ⬇️ Download as CSV
                                </button>
                            </div>
                            <p class="text-xs text-gray-500">Your data is saved locally and private.</p>
                        `;
                        break;
                }

                return html;
            }

            renderLanding() {
                return `
                    <div class="min-h-screen bg-gradient-to-r from-white via-indigo-50 to-pink-50 flex items-center justify-center px-4 py-8">
                        <div class="text-center max-w-2xl">
                            <div class="text-7xl mb-6">🇯🇵</div>
                            <h1 class="text-4xl font-bold text-gray-900 mb-3">Welcome, Gambhir Family</h1>
                            <p class="text-xl text-gray-600 mb-8">Fill in your Japan Visa Application</p>
                            <div class="bg-white rounded-2xl shadow-md p-8 mb-8 border">
                                <p class="text-gray-700 mb-6">Pre-filled family info. Just add your personal details!</p>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                    <div class="bg-indigo-50 rounded-lg p-4">
                                        <div class="text-2xl mb-2">✓</div>
                                        <p class="text-sm font-medium">Pre-filled</p>
                                    </div>
                                    <div class="bg-pink-50 rounded-lg p-4">
                                        <div class="text-2xl mb-2">🔒</div>
                                        <p class="text-sm font-medium">Private</p>
                                    </div>
                                    <div class="bg-amber-50 rounded-lg p-4">
                                        <div class="text-2xl mb-2">💾</div>
                                        <p class="text-sm font-medium">Auto-saves</p>
                                    </div>
                                </div>
                                <button onclick="app.startApplication()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-xl text-lg">
                                    Start Application →
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            startApplication() {
                this.showLanding = false;
                this.currentStep = 0;
                this.render();
            }

            render() {
                const app = document.getElementById('app');
                
                if (this.showLanding) {
                    app.innerHTML = this.renderLanding();
                    return;
                }

                const progress = ((this.currentStep + 1) / this.steps.length) * 100;

                app.innerHTML = `
                    <div class="min-h-screen bg-gray-50 py-8 px-4">
                        <div class="max-w-3xl mx-auto">
                            <div class="mb-8 text-center">
                                <h1 class="text-3xl font-bold text-gray-900 mb-2">Japan Visa Application</h1>
                                <p class="text-gray-600">Gambhir Family</p>
                            </div>

                            <div class="mb-8">
                                <div class="flex justify-between mb-2">
                                    <span class="text-sm font-medium text-gray-700">Step ${this.currentStep + 1} of ${this.steps.length}</span>
                                    <span class="text-sm font-medium text-gray-700">${Math.round(progress)}%</span>
                                </div>
                                <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-indigo-600 to-pink-500" style="width: ${progress}%"></div>
                                </div>
                            </div>

                            <div class="bg-white rounded-xl shadow-md p-8 mb-8">
                                <h2 class="text-2xl font-bold text-gray-900 mb-6">${this.steps[this.currentStep].title}</h2>
                                <div class="space-y-6">
                                    ${this.renderStep()}
                                </div>
                            </div>

                            <div class="flex gap-4">
                                <button onclick="app.prevStep()" class="flex-1 ${this.currentStep === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-900 hover:bg-gray-300'} font-semibold py-3 px-4 rounded-lg">
                                    ← Back
                                </button>
                                <button onclick="app.nextStep()" class="flex-1 bg-gradient-to-r from-indigo-600 to-pink-500 hover:from-indigo-700 hover:to-pink-600 text-white font-semibold py-3 px-4 rounded-lg">
                                    ${this.currentStep === this.steps.length - 1 ? 'Download' : 'Continue →'}
                                </button>
                            </div>

                            <div class="mt-6 text-center text-sm text-gray-500">
                                💾 Auto-saved
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        const app = new VisaApp();
    </script>
</body>
</html>
